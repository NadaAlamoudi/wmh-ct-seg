name: wmhct
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - numpy>=1.22
  - scipy>=1.8
  - pandas>=1.4
  - matplotlib>=3.5
  - seaborn>=0.12
  - scikit-learn>=1.1
  - openpyxl>=3.0
  - tqdm>=4.62
  - pip:
      - nibabel>=4.0
      - SimpleITK>=2.1
      - pydicom>=2.3
      # Significance annotations on the burden-class boxplots. Note it pins an older
      # seaborn range; if pip downgrades seaborn, check the figures still render.
      - statannotations>=0.5
      # nnU-Net is optional here; install the exact version used for the paper.
      # - nnunetv2==<version used>

# External tools are NOT installed by this environment and must be available on PATH:
#   dcm2niix                        DICOM to NIfTI conversion
#   FSL (flirt, convert_xfm)        registration and transform inversion
#   NiftyReg (reg_aladin,
#             reg_resample,
#             reg_transform)        alternative registration back-end
#   docker + freesurfer/synthstrip  skull stripping
